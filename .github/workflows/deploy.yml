name: Deploy

# Mirrors ~/Documents/Code/shoyu-chat's deploy.yml shape (see
# docs/related-repos.md) — SSH into the droplet, pull, rebuild, restart.
# Requires HOST/USERNAME/SSH_KEY secrets configured on this repo (Settings →
# Secrets and variables → Actions) before the deploy step does anything;
# until then this fails safely at the SSH connection step.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/an-an

            # Discard local lockfile and generated-data changes to prevent pull
            # conflicts (lockfile mirrors shoyu-chat's deploy.yml). data/build is
            # versioned; anything modified there on the droplet is stale output.
            git checkout -- pnpm-lock.yaml data/build || true
            git pull origin main

            corepack enable
            pnpm install --frozen-lockfile

            # Rebuild scenarios only. The lexicon is NOT rebuilt here: it needs
            # the git-ignored Wiktionary/Unihan dumps (see data/raw/SOURCES.md),
            # which the droplet doesn't have, so a rebuild would deploy a
            # lexicon with worse glosses and dirty the checkout. The committed
            # data/build/lexicon.v2.json is the source of truth.
            pnpm --filter @anan/data-pipeline build:scenarios

            # Build the web PWA and the proxy server.
            pnpm --filter @anan/web build
            pnpm --filter @anan/proxy build
            pnpm check:azure-key

            # Publish the web build where nginx's /an-an location expects it.
            mkdir -p /var/www/an-an
            rm -rf /var/www/an-an/dist
            cp -r apps/web/dist /var/www/an-an/dist

            # Restart (or first-start) the proxy under PM2.
            pm2 restart an-an-proxy --update-env || \
              pm2 start apps/proxy/ecosystem.config.cjs --env production
            pm2 save

            # Phase 28: a progress save is several MB. Push 5 MB through the PUBLIC address
            # (Cloudflare -> nginx -> proxy) to a route that throws it away. nginx's default 1 MB
            # body limit answers 413 before the proxy sees anything, and then every save fails, so
            # the deploy fails here instead of progress silently not being saved.
            for i in $(seq 1 30); do curl -fsS http://localhost:3002/v1/health >/dev/null 2>&1 && break; sleep 1; done
            SITE_CODE_VALUE=$(grep -E '^SITE_CODE=' apps/proxy/.env 2>/dev/null | head -1 | cut -d= -f2- | tr -d "\"'" || true)
            head -c 5242880 /dev/zero > /tmp/an-an-selftest.bin
            status=$(curl -s -o /tmp/an-an-selftest.out -w '%{http_code}' -X PUT \
              -H "x-site-code: ${SITE_CODE_VALUE}" -H 'content-type: application/octet-stream' \
              --data-binary @/tmp/an-an-selftest.bin https://holop.dev/an-an/api/v1/sync-selftest || echo 000)
            rm -f /tmp/an-an-selftest.bin
            if [ "$status" = "413" ]; then
              echo "::error::Progress saves are too big for nginx (413 on a 5 MB test save)."
              echo "Add 'client_max_body_size 40m;' to the 'location /an-an/api/' block, then: sudo nginx -t && sudo systemctl reload nginx"
              exit 1
            fi
            echo "sync self-test (5 MB save through nginx): HTTP $status $(cat /tmp/an-an-selftest.out 2>/dev/null)"

