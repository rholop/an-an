name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (core)
        run: pnpm --filter @anan/core exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (data-pipeline)
        run: pnpm --filter @anan/data-pipeline exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (web)
        run: pnpm --filter @anan/web exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (proxy)
        run: pnpm --filter @anan/proxy exec tsc --noEmit -p tsconfig.json

      # The lexicon is NOT rebuilt here. Its glosses use the Wiktionary and Unihan
      # dumps, which are git-ignored (data/raw/SOURCES.md), so a CI rebuild is a
      # worse lexicon than the one that ships (e.g. N1-L2 gloss support 92.5% vs
      # 95.6%) and the tests would be checking something nobody uses. The tests run
      # against the committed data/build/lexicon.v2.json, as deploy does.
      - name: Build scenarios (data-pipeline)
        run: pnpm --filter @anan/data-pipeline build:scenarios

      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build web + proxy
        run: |
          pnpm --filter @anan/web build
          pnpm --filter @anan/proxy build

      - name: Azure key must not be in the web bundle or proxy
        run: pnpm check:azure-key

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Committed lexicon, not a rebuild (see the unit-test job above).
      - name: Build scenarios
        run: pnpm --filter @anan/data-pipeline build:scenarios

      - name: Install Playwright browsers
        run: pnpm --filter @anan/web exec playwright install --with-deps chromium webkit

      - name: Sync lexicon into apps/web/public
        run: pnpm --filter @anan/web sync:lexicon

      # Chat and Cloze load scenarios.json at runtime; without it they sit on
      # "Loading…" and their e2e specs time out.
      - name: Sync scenarios into apps/web/public
        run: pnpm --filter @anan/web sync:scenarios

      # Phase 12: the Textbook page loads the structure + lesson sentences from here.
      - name: Sync textbook into apps/web/public
        run: pnpm --filter @anan/web sync:textbook

      - name: E2E tests
        run: pnpm --filter @anan/web exec playwright test
