# Hand-curated supplement entries: particles, fillers, chunks, Taiwan-specific
# terms and NPC names that the SC-TOP TOCFL list omits or under-specifies.
#
# Shape mirrors `Word` (see CLAUDE.md), minus fields the pipeline derives:
#   id            -> "supp-" + stable hash (pipeline)
#   chars         -> split from headword (pipeline)
#   pinyinNumeric -> derived from pinyin (pipeline)
# `pinyin`/`zhuyin` here are a hint; the pipeline still verifies against MOE and
# records any mismatch in the review report, same as for TOCFL rows.
# `level: null` unless noted — these are pragmatic day-1 vocabulary, not banded.

