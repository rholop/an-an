  - { zh: 我下班以後，先去買菜，然後做晚飯。, en: "After work I first go grocery shopping, then cook dinner.", grammar: [gram-xian-ranhou] }
  - { zh: 他先喝咖啡，然後看書。, en: "He first drinks coffee, then reads.", grammar: [gram-xian-ranhou] }
