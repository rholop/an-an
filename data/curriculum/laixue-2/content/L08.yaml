  - { zh: 我明天先去銀行，然後去百貨公司。, en: "Tomorrow I'll go to the bank first, then the department store.", grammar: [gram-xian-ranhou] }
  - { zh: 我吃早飯了。, en: "I have eaten breakfast.", grammar: [gram-le-completion] }
  - { zh: 李小姐去日本了。, en: "Miss Li went to Japan.", grammar: [gram-le-completion] }
  - { zh: 我喝了三杯果汁。, en: "I drank three glasses of juice.", grammar: [gram-le-completion] }
  - { zh: 她買了兩件外套。, en: "She bought two coats.", grammar: [gram-le-completion] }
  - { zh: 我們看了兩個鐘頭的電影。, en: "We watched a two-hour movie.", grammar: [gram-le-completion] }
  - { zh: 昨天我洗了頭髮。, en: "Yesterday I washed my hair.", grammar: [gram-le-completion] }
  - { zh: 每天我吃了早飯，開車去上班。, en: "Every day after I eat breakfast, I drive to work.", grammar: [gram-le-completion] }
  - { zh: 我明天吃了飯，就去看電影。, en: "Tomorrow after I eat, I'll go to a movie.", grammar: [gram-le-completion] }
  - { zh: 他下班了，現在去運動。, en: "He has finished work and is going to exercise now.", grammar: [gram-le-completion] }
  - { zh: 我今天早上七點起床了。, en: "I got up at seven this morning.", grammar: [gram-le-completion] }
