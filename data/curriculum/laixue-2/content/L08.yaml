  - { zh: 我想問問這個蛋糕多少錢。, en: "I'd like to ask how much this cake is.", grammar: [gram-verb-reduplication] }
  - { zh: 星期天我們一起逛逛街吧。, en: "On Sunday let's browse the shops together.", grammar: [gram-verb-reduplication] }
scenarios:
  - slug: daily-routine
    title: "Kevin asks about your typical day"
    npc:
      id: kevin
      name: 凱文
      personality: >
        Gloria's easy-going coworker. He loves to compare daily routines and is
        always curious about what people eat for breakfast.
      speechStyle: >
        Short relaxed sentences with words from books 1 and 2 (up to lesson 8).
        Uses 先……然後…… when he tells his own day.
      particles: []
    setting: >
      Kevin and the learner are at the office coffee corner on a Monday morning,
      comparing how they spend a typical day.
    goalSteps:
      - { id: getup, description: "Say when you get up and what you do first.", keywordHints: ["起床", "早上", "先"] }
      - { id: breakfast, description: "Say what you eat or drink for breakfast.", keywordHints: ["早飯", "果汁", "蛋", "咖啡"] }
      - { id: work, description: "Say when you go to work and finish work.", keywordHints: ["上班", "下班"] }
      - { id: order, description: "Tell two things in order with 先……然後…….", keywordHints: ["先", "然後"] }
      - { id: done, description: "Say what you already did today (……了).", keywordHints: ["了"] }
      - { id: evening, description: "Say what you like to do in the evening (聽聽音樂, 看看書).", keywordHints: ["聽聽", "看看", "音樂", "看書"] }
    vocabExtras: [賣, 早上, 起床, 先, 洗, 頭髮, 然後, 早飯, 蛋, 果汁, 上班, 樓, 漢堡, 可樂, 冰淇淋, 下班, 離開, 帶, 狗, 電影, 遊戲, 準備, 一天, 洗澡, 洗頭髮, 一樓, 有時候, 看書]
    opener: { zh: 你好！你每天早上幾點起床？, en: "Hello! What time do you get up every morning?" }
    successLine: { zh: 你的一天真不錯，我每天也先洗澡，然後吃早飯。, en: "Your day sounds great; I also shower first and then eat breakfast every day." }
journalPrompts:
  - { en: "Describe your typical day with 先……，然後…….", zh: 我早上先洗澡，然後吃早飯。, words: [早上, 起床, 早飯, 上班], grammar: [gram-xian-ranhou] }
  - { en: "Write what you did yesterday using 了.", words: [洗澡, 下班, 電影, 準備], grammar: [gram-le-completion] }
  - { en: "Write what you like to do at home in the evening, using a repeated verb (聽聽音樂).", words: [看書, 遊戲, 有時候], grammar: [gram-verb-reduplication] }
