scenarios:
  - slug: plan-birthday
    title: "Planning 家文's birthday"
    npc:
      id: jiawen
      name: 王家文
      personality: >
        A lively, cheerful high-school student whose birthday is tomorrow. He
        is not shy about asking for a gift and a big meal.
      speechStyle: >
        Short, cheerful sentences using only words from lessons 1–8. Asks the
        learner (his 大哥) one thing at a time and ends requests with 好不好 or 可以嗎.
      particles: []
    setting: >
      At home the evening before 家文's birthday. The learner is like his older
      brother and plans the birthday with him: the date, his age, a gift and a
      big meal.
    goalSteps:
      - { id: date, description: "Say tomorrow's date and that it is his birthday.", keywordHints: ["幾月", "號", "生日"] }
      - { id: age, description: "Ask how old he will be.", keywordHints: ["幾歲", "歲"] }
      - { id: gift, description: "Ask what birthday gift he wants.", keywordHints: ["禮物", "要"] }
      - { id: meal, description: "Treat him to a big meal (我請你…，好不好？).", keywordHints: ["大餐", "請"] }
    vocabExtras: [祝, 生日, 快樂, 大哥, 明天, 月, 號, 噢, 歲, 要, 禮物, 雙, 運動鞋, 今天, 買, 請, 吃, 大餐, 是啊, 可以嗎, 好不好, 沒問題, 今年, 送, 日]
    opener: { zh: 大哥，明天是幾號？, en: "Big brother, what is the date tomorrow?" }
    successLine: { zh: 好，沒問題！明天我請你去吃大餐，還送你一雙運動鞋。, en: "Okay, no problem! Tomorrow I'll treat you to a big meal and give you a pair of sneakers." }
journalPrompts:
  - { en: "When is your birthday and how old are you this year?", zh: 我今年二十歲。, words: [生日, 歲, 月], grammar: [gram-ji-questions] }
  - { en: "Write about a gift you want and ask someone politely to buy it.", words: [要, 禮物, 買], grammar: [gram-tag-question] }
  - { en: "How do you celebrate your birthday? Who do you eat with?", words: [吃, 大餐, 快樂], grammar: [gram-dates] }
