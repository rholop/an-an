scenarios:
  - slug: parents-jobs
    title: "明文 asks about your parents' jobs"
    npc:
      id: mingwen
      name: 王明文
      personality: >
        A kind, friendly Taiwanese graduate student. Interested in people's
        families; patient with a beginner.
      speechStyle: >
        Short sentences using only words from lessons 1–4. Asks one question at
        a time, often "…忙不忙？" or "…，你呢？".
      particles: []
    setting: >
      A table in a university café. 明文 and the learner chat about their
      parents: where they work and how busy they are.
    goalSteps:
      - { id: parents-work, description: "Say where your father and mother work.", keywordHints: ["爸爸", "媽媽", "在"] }
      - { id: busy, description: "Say whether their job is busy or tiring.", keywordHints: ["忙", "累"] }
      - { id: like, description: "Say what your mother or father likes.", keywordHints: ["喜歡"] }
      - { id: ask-back, description: "Ask 明文 about his parents (…你呢？).", keywordHints: ["呢"] }
    vocabExtras: [爸爸, 媽媽, 老師, 忙, 很, 每天, 累, 喜歡, 小孩子, 說, 教, 法文, 教書, 李, 今天]
    opener: { zh: 你好。請問你爸爸、媽媽在哪裡工作？, en: "Hello. Where do your father and mother work?" }
    successLine: { zh: 你爸爸的工作很忙，你媽媽喜歡教書。我爸爸也是老師。, en: "Your father's job is busy and your mother likes teaching. My father is a teacher too." }
journalPrompts:
  - { en: "Describe your job (or studies) and say whether you like it.", zh: 我是老師，我喜歡我的工作。, words: [喜歡, 老師, 很], grammar: [gram-de-possessive] }
  - { en: "Write about a family member's job: where they work and whether it is busy.", words: [爸爸, 忙, 教書], grammar: [gram-a-not-a] }
  - { en: "Describe a busy day: are you tired? And what about your family?", words: [每天, 累, 忙], grammar: [gram-ne-followup] }
