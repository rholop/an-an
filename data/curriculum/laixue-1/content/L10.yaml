  - { zh: 你有幾個孩子？, en: "How many children do you have?", grammar: [gram-duoshao-ji] }
  - { zh: 你有幾個弟弟？, en: "How many younger brothers do you have?", grammar: [gram-duoshao-ji] }
  - { zh: 他喝幾杯咖啡？, en: "How many cups of coffee does he drink?", grammar: [gram-duoshao-ji] }
  - { zh: 我每天喝兩杯咖啡。, en: "I drink two cups of coffee every day.", grammar: [gram-number-measure] }
scenarios:
  - slug: coffee-break
    title: "Coffee break with 明文: learning Mandarin"
    npc:
      id: mingwen
      name: 王明文
      personality: >
        A kind, friendly Taiwanese graduate student who helps the learner
        practise Mandarin. Encouraging; he asks how learning is going and which
        parts are hard.
      speechStyle: >
        Short sentences using only words from lessons 1–10. One question at a
        time, often "…得怎麼樣？", "…難不難？" or "你會…嗎？".
      particles: []
    setting: >
      A coffee shop near campus. 明文 and the learner take a break and talk
      about learning Mandarin: what is hard, speaking versus writing.
    goalSteps:
      - { id: how-learning, description: "Say how your Mandarin is going (學得…).", keywordHints: ["學得", "不錯"] }
      - { id: hard, description: "Say what is hard for you (…有一點難).", keywordHints: ["難", "有一點"] }
      - { id: can-do, description: "Say what you can do (我會…).", keywordHints: ["我會", "不會"] }
      - { id: how-many, description: "Say roughly how many characters you can write.", keywordHints: ["多少", "差不多", "字"] }
    vocabExtras: [學, 中文, 難, 休息, 一下, 喝, 杯, 咖啡, 吧, 得, 覺得, 自己, 不錯, 會, 多少, 差不多, 字, 練習, 說話, 寫字, 有一點, 聊天, 做飯, 快, 貴]
    opener: { zh: 你好！我們去喝杯咖啡吧。你學中文，學得怎麼樣？, en: "Hi! Let's go and have a cup of coffee. How is your Mandarin coming along?" }
    successLine: { zh: 你說得不錯！我們常常聊天，你的中文會很好。, en: "You speak well! If we chat often, your Mandarin will get very good." }
journalPrompts:
  - { en: "Is Chinese hard for you? Say what is hard and what is easy.", zh: 寫字有一點難。, words: [難, 學, 覺得], grammar: [gram-youyidian] }
  - { en: "What do you practise, and how well do you do it (說得很好, 寫得不錯)?", words: [練習, 說話, 聊天], grammar: [gram-de-complement] }
  - { en: "Write about something you can do well and something you can't do yet.", words: [會, 寫字, 不錯], grammar: [gram-hui-can] }
