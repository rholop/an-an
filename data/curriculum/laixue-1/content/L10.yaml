lesson: 10
sentences:
  - { zh: 他說中文，說得很好。, en: "He speaks Mandarin very well.", grammar: [gram-de-complement] }
  - { zh: 我學中文，學得不錯。, en: "I am learning Mandarin quite well.", grammar: [gram-de-complement] }
  - { zh: 她唱歌，唱得很好。, en: "She sings very well.", grammar: [gram-de-complement] }
  - { zh: 我弟弟跳舞，跳得不好。, en: "My younger brother does not dance well.", grammar: [gram-de-complement] }
  - { zh: 李老師寫字，寫得很快。, en: "Teacher Li writes characters fast.", grammar: [gram-de-complement] }
  - { zh: 你說中文，說得怎麼樣？, en: "How well do you speak Mandarin?", grammar: [gram-de-complement] }
  - { zh: 你學中文，學得怎麼樣？, en: "How are you doing at learning Mandarin?", grammar: [gram-de-complement] }
  - { zh: 我哥哥跑步，跑得很快。, en: "My older brother runs very fast.", grammar: [gram-de-complement] }
  - { zh: 我姊姊做飯，做得很好。, en: "My older sister cooks very well.", grammar: [gram-de-complement] }
  - { zh: 他打網球，打得不錯。, en: "He plays tennis quite well.", grammar: [gram-de-complement] }
  - { zh: 我說得不好，可是我常常練習。, en: "I don't speak well, but I practise often.", grammar: [gram-de-complement] }
  - { zh: 我說中文有一點難。, en: "Speaking Mandarin is a little difficult for me.", grammar: [gram-youyidian] }
  - { zh: 寫字有一點難。, en: "Writing characters is a bit hard.", grammar: [gram-youyidian] }
  - { zh: 我今天有一點累。, en: "I am a little tired today.", grammar: [gram-youyidian] }
  - { zh: 我今天有點忙。, en: "I am a little busy today.", grammar: [gram-youyidian] }
  - { zh: 這家餐廳有一點貴。, en: "This restaurant is a little expensive.", grammar: [gram-youyidian] }
  - { zh: 我覺得聊天不難，可是寫字有一點難。, en: "I think chatting isn't hard, but writing characters is a little hard.", grammar: [gram-youyidian] }
  - { zh: 我會說中文。, en: "I can speak Mandarin.", grammar: [gram-hui-can] }
  - { zh: 我會寫字。, en: "I can write characters.", grammar: [gram-hui-can] }
  - { zh: 我不會打網球。, en: "I can't play tennis.", grammar: [gram-hui-can] }
  - { zh: 我不會跳舞，可是我會唱歌。, en: "I can't dance, but I can sing.", grammar: [gram-hui-can] }
  - { zh: 你會說中文嗎？, en: "Can you speak Mandarin?", grammar: [gram-hui-can] }
  - { zh: 你會做飯嗎？, en: "Can you cook?", grammar: [gram-hui-can] }
  - { zh: 他會寫多少字？, en: "How many characters can he write?", grammar: [gram-hui-can, gram-duoshao-ji] }
  - { zh: 你有多少個學生？, en: "How many students do you have?", grammar: [gram-duoshao-ji] }
