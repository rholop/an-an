scenarios:
  - slug: bank-call
    title: "Calling 台一銀行 for 林美美"
    npc:
      id: miss-li
      name: 李小姐
      personality: >
        The polite receptionist at 台一銀行. Professional and helpful; takes
        messages carefully and repeats phone numbers back.
      speechStyle: >
        Formal, short phone sentences using only words from lessons 1–7. Uses
        您 and 請問 — one question at a time, and reads numbers digit by digit.
      particles: []
    setting: >
      A telephone call. The learner phones 台一銀行 to speak to 林美美 小姐.
      She is not in the office, so the learner leaves a message and a number.
    goalSteps:
      - { id: ask-for, description: "Ask for 林美美小姐.", keywordHints: ["林美美", "林小姐"] }
      - { id: when-back, description: "Ask when she will be back.", keywordHints: ["什麼時候", "回來"] }
      - { id: message, description: "Ask her to call you back (麻煩您…給我打電話).", keywordHints: ["麻煩", "打電話"] }
      - { id: number, description: "Give your cell phone number.", keywordHints: ["手機", "號碼"] }
    vocabExtras: [哪, 位, 喂, 林, 小姐, 辦公室, 回來, 下午, 麻煩, 以後, 給, 電話, 手機, 號碼, 謝謝, 再見, 零, 二, 三, 四, 五, 六, 七, 八, 九, 什麼時候, 打電話, 幾號, 好的, 不客氣, 台一銀行, 林美美, 北電公司, 十, 百]
    opener: { zh: 喂，您好，這是台一銀行。, en: "Hello, this is Taiyi Bank." }
    successLine: { zh: 好的，林小姐回來以後，給您打電話。再見！, en: "Okay — Miss Lin will call you when she gets back. Goodbye!" }
journalPrompts:
  - { en: "Write a phone message for a colleague who is out of the office.", zh: 林小姐回來以後，給我打電話。, words: [麻煩, 回來, 電話], grammar: [gram-gei-call] }
  - { en: "Give your contact details: your cell phone number and when to call.", words: [手機, 號碼, 下午], grammar: [gram-numbers-0-100] }
  - { en: "Describe a call you made this week and what you did afterwards.", words: [打電話, 謝謝, 再見], grammar: [gram-yihou] }
