scenarios:
  - slug: siblings-chat
    title: "家文 asks about your family"
    npc:
      id: jiawen
      name: 王家文
      personality: >
        A lively, cheerful Taiwanese high-school student visiting the United
        States. Curious about everyone and quick to ask the next question.
      speechStyle: >
        Short, friendly sentences using only words from lessons 1 and 2. Asks
        one question at a time and repeats the number the learner gives.
      particles: []
    setting: >
      A summer-camp lounge in the United States. 家文 has just met the learner
      and wants to know about their brothers and sisters.
    goalSteps:
      - { id: greet, description: "Greet 家文 and tell him your name.", keywordHints: ["您好", "我叫"] }
      - { id: have-siblings, description: "Say whether you have brothers or sisters.", keywordHints: ["我有", "我沒有"] }
      - { id: how-many, description: "Say how many older/younger siblings you have.", keywordHints: ["一個", "兩個"] }
      - { id: ask-back, description: "Ask 家文 about his siblings.", keywordHints: ["你有", "嗎", "您呢"] }
    vocabExtras: [有, 兩, 個, 弟弟, 你, 嗎, 一, 姐姐, 也, 哥哥, 沒, 只, 兄弟姊妹, 妹妹]
    opener: { zh: 您好，我是王家文。您有兄弟姊妹嗎？, en: "Hello, I'm Wang Jiawen. Do you have any brothers or sisters?" }
    successLine: { zh: 我有一個姐姐，兩個弟弟。, en: "I have one older sister and two younger brothers." }
journalPrompts:
  - { en: "Describe your family: how many older and younger siblings you have.", zh: 我有一個姐姐。, words: [有, 個, 兩], grammar: [gram-number-measure] }
  - { en: "Which of your friends have siblings? Who is an only child?", words: [也, 只, 兄弟姊妹], grammar: [gram-ye-also] }
  - { en: "Write about your partner's family: who they have and who they don't.", words: [沒, 有, 嗎], grammar: [gram-you-meiyou] }
