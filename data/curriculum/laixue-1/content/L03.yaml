scenarios:
  - slug: family-jobs
    title: "Lisa asks about your family"
    npc:
      id: lisa
      name: Lisa
      personality: >
        Gloria's sweet, warm-hearted coworker. Genuinely interested in other
        people's families and always asks a friendly follow-up.
      speechStyle: >
        Short, kind sentences using only words from lessons 1–3. One question
        at a time; repeats the learner's answer back to confirm.
      particles: []
    setting: >
      A quiet corner of the office at lunchtime. Lisa and the learner are
      chatting about their families.
    goalSteps:
      - { id: student, description: "Say whether your sister or brother is a student.", keywordHints: ["學生", "不是學生"] }
      - { id: workplace, description: "Say where a family member works.", keywordHints: ["在", "工作"] }
      - { id: married, description: "Say who is married and whether they have children.", keywordHints: ["結婚了", "孩子"] }
      - { id: both, description: "Say that two people both do something (都).", keywordHints: ["都"] }
    vocabExtras: [他, 不, 學生, 大學, 在, 哪裡, 工作, 銀行, 先生, 電腦, 公司, 孩子, 兒子, 女兒, 小孩, 都, 小學, 畢業了, 結婚了, 他們, 念書, 法國, 和]
    opener: { zh: 你好，我是Lisa。你姐姐是學生嗎？, en: "Hello, I'm Lisa. Is your older sister a student?" }
    successLine: { zh: 你姐姐結婚了，他們有兩個孩子。他們都不是學生。, en: "Your sister is married and they have two children. They are not students." }
journalPrompts:
  - { en: "Where do the members of your family work or study?", zh: 我哥哥在銀行工作。, words: [在, 工作, 銀行], grammar: [gram-zai-place] }
  - { en: "Is anyone in your family married? Do they have children?", words: [結婚了, 先生, 孩子], grammar: [gram-dou-all] }
  - { en: "Write about a family member who is no longer a student.", words: [學生, 大學, 畢業了], grammar: [gram-bu-negation] }
