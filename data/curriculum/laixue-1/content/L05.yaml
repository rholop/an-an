scenarios:
  - slug: introduce-friend
    title: "Introducing a friend to 明文's father"
    npc:
      id: mr-wang
      name: 王先生
      personality: >
        明文's father: warm, polite and welcoming to visitors. He likes to hear
        where guests live and where they would like to travel.
      speechStyle: >
        Short, polite sentences using only words from lessons 1–5. Asks one
        question at a time; uses 您 with new people.
      particles: []
    setting: >
      The Wang family's living room. The learner introduces a friend to 王先生
      and they talk about where the friend lives and holiday plans.
    goalSteps:
      - { id: introduce, description: "Introduce your friend (這是我朋友…).", keywordHints: ["這是"] }
      - { id: lives, description: "Say where your friend lives.", keywordHints: ["住在"] }
      - { id: holiday, description: "Say where your friend wants to go on holiday.", keywordHints: ["想去", "玩"] }
      - { id: welcome, description: "Say you are happy to meet 王先生.", keywordHints: ["高興", "認識"] }
    vocabExtras: [這, 朋友, 認識, 高興, 平常, 住在, 現在, 學校, 放假, 來, 玩, 歡迎, 想, 去, 國家, 公園, 好久不見, 迪士尼樂園, 臺北, 加州, 誰, 父母]
    opener: { zh: 您好，我是明文的爸爸。這是您的朋友嗎？, en: "Hello, I'm Mingwen's father. Is this your friend?" }
    successLine: { zh: 歡迎你來臺灣玩！認識你很高興。, en: "Welcome to Taiwan! I'm very glad to meet you." }
journalPrompts:
  - { en: "Introduce a friend: who they are and how you know them.", zh: 這是我朋友。, words: [朋友, 認識, 高興], grammar: [gram-zhe-shi-intro] }
  - { en: "Where do you live now, and where do your parents live?", words: [住在, 現在, 學校], grammar: [gram-zhuzai] }
  - { en: "Write about a place you would like to visit and what you would do there.", words: [想, 去, 玩], grammar: [gram-qu-place-verb] }
