lesson: 3
sentences:
  - { zh: 從星期一到星期五，我都上班。, en: "From Monday to Friday I work.", grammar: [gram-cong-dao-time] }
  - { zh: 從現在到感恩節，只有十天。, en: "From now until Thanksgiving there are only ten days.", grammar: [gram-cong-dao-time] }
  - { zh: 從早上八點到下午五點，我在公司工作。, en: "From eight in the morning to five in the afternoon I work at the company.", grammar: [gram-cong-dao-time] }
  - { zh: 我們從下個月一號到十號放假。, en: "We are on vacation from the 1st to the 10th of next month.", grammar: [gram-cong-dao-time] }
  - { zh: 從七月到九月，這裡的天氣都很熱。, en: "From July to September the weather here is hot.", grammar: [gram-cong-dao-time] }
  - { zh: 他從早上到晚上都在準備晚飯。, en: "He is preparing dinner from morning till night.", grammar: [gram-cong-dao-time] }
  - { zh: 從今天到下星期，我都有空。, en: "From today until next week I am free.", grammar: [gram-cong-dao-time] }
  - { zh: 我明天想早一點起床。, en: "Tomorrow I want to get up a little earlier.", grammar: [gram-zao-wan-yidian] }
  - { zh: 今天工作很多，我要晚一點下班。, en: "There is a lot of work today; I'll get off work a bit later.", grammar: [gram-zao-wan-yidian] }
  - { zh: 你可以早一點來幫忙嗎？, en: "Can you come a little earlier to help?", grammar: [gram-zao-wan-yidian] }
  - { zh: 我們晚一點再吃飯吧。, en: "Let's eat a little later.", grammar: [gram-zao-wan-yidian] }
  - { zh: 週末人很多，我們早一點出門吧。, en: "There are many people on weekends; let's leave a little earlier.", grammar: [gram-zao-wan-yidian] }
  - { zh: 感恩節的菜，我想早一點準備。, en: "For the Thanksgiving dishes, I want to prepare a little earlier.", grammar: [gram-zao-wan-yidian] }
  - { zh: 你晚一點給我打電話吧。, en: "Call me a bit later.", grammar: [gram-zao-wan-yidian] }
  - { zh: 這個火雞太小了，我想買大一點的。, en: "This turkey is too small; I want to buy a bigger one.", grammar: [gram-vs-yidian] }
  - { zh: 你可以說多一點嗎？, en: "Could you say a little more?", grammar: [gram-vs-yidian] }
  - { zh: 請你快一點！, en: "Please be a bit quicker!", grammar: [gram-vs-yidian] }
  - { zh: 這家店的麵包便宜一點。, en: "The bread at this shop is a bit cheaper.", grammar: [gram-vs-yidian] }
  - { zh: 星期天的人比較多，今天人少一點。, en: "There are more people on Sunday; today there are a few fewer.", grammar: [gram-vs-yidian] }
  - { zh: 我想買貴一點的甜點。, en: "I want to buy a slightly more expensive dessert.", grammar: [gram-vs-yidian] }
  - { zh: 這件外套小了，有大一點的嗎？, en: "This coat is too small; do you have a slightly bigger one?", grammar: [gram-vs-yidian] }
  - { zh: 明天的天氣會冷一點。, en: "The weather tomorrow will be a bit colder.", grammar: [gram-vs-yidian] }
scenarios:
  - slug: thanksgiving-plans
    title: "Gloria plans a Thanksgiving dinner"
    npc:
      id: gloria
      name: 高莉亞
      personality: >
        An outgoing coworker who loves hosting friends and always makes a plan with a
        list of dishes. She is cheerful and a little bit worried about being late.
      speechStyle: >
        Cheerful short sentences with words from books 1 to 3 (up to book 3 lesson 3).
        Often says 早一點 / 晚一點 and asks for help (幫忙).
      particles: []
    setting: >
      Gloria and the learner are making plans for Thanksgiving at the office. She
      wants to invite friends from other countries and needs help with the dishes.
    goalSteps:
      - { id: greet, description: "Say how you usually spend Thanksgiving or a holiday (過節).", keywordHints: ["感恩節", "過節", "回家"] }
      - { id: dates, description: "Say which days you are free (從……到……).", keywordHints: ["從", "到"] }
      - { id: dishes, description: "Suggest some dishes for the dinner (火雞, 沙拉, 麵包, 甜點).", keywordHints: ["火雞", "沙拉", "麵包", "甜點", "建議"] }
      - { id: bigger, description: "Say a dish should be bigger, sweeter or cheaper (……一點).", keywordHints: ["一點"] }
      - { id: earlier, description: "Say what you will prepare earlier or later (早一點 / 晚一點).", keywordHints: ["早一點", "晚一點"] }
      - { id: invite, description: "Offer to help and invite a friend (幫忙, 參加).", keywordHints: ["幫忙", "參加", "外國朋友"] }
    vocabExtras: [感恩節, 嗨, 過, 趕快, 外國, 熱鬧, 可以, 參加, 菜, 怕, 來不及, 早, 一點, 幫忙, 這樣, 建議, 烤, 火雞, 馬鈴薯泥, 沙拉, 麵包, 甜點, 南瓜派, 好像, 或是, 開心, 晚, 回家, 過節, 早一點, 烤火雞]
    opener: { zh: 嗨！感恩節你想怎麼過？, en: "Hi! How would you like to spend Thanksgiving?" }
    successLine: { zh: 太好了！感恩節我們一起過，一定很熱鬧。, en: "Great! We'll spend Thanksgiving together; it will surely be lively." }
journalPrompts:
  - { en: "Write about when you are free and busy (從……到……) and what you will do earlier or later (早一點 / 晚一點).", zh: 從星期一到星期五，我都上班。, words: [過節, 早一點, 回家, 晚], grammar: [gram-cong-dao-time, gram-zao-wan-yidian] }
  - { en: "Write a paragraph about the dishes for a holiday meal and whether they should be bigger, sweeter or cheaper (……一點).", words: [火雞, 沙拉, 麵包, 甜點], grammar: [gram-vs-yidian, gram-zao-wan-yidian] }
  - { en: "Write a paragraph about how you would spend Thanksgiving or another holiday and who you would invite (從……到……, ……一點).", words: [感恩節, 熱鬧, 參加, 開心, 建議], grammar: [gram-cong-dao-time, gram-vs-yidian] }
