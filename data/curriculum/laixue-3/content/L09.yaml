scenarios:
  - slug: weekend-plans
    title: "Jose asks how you arrange the weekend"
    npc:
      id: jose
      name: 何希
      personality: >
        Gloria's husband, who loves cooking, swimming and grilling. He enjoys planning
        a weekend with a list of chores and one fun outing.
      speechStyle: >
        Relaxed short sentences with words from books 1 to 3 (up to book 3 lesson 9).
        Gives small commands with 把 (把……拿出去) and asks what the learner will do.
      particles: []
    setting: >
      Jose and the learner plan Saturday and Sunday: first the housework at home,
      then something fun outside, perhaps a hike or a barbecue.
    goalSteps:
      - { id: usual, description: "Say what you usually do on weekends.", keywordHints: ["週末", "活動", "通常", "平常"] }
      - { id: housework, description: "Name some housework (打掃, 整理, 擦).", keywordHints: ["打掃", "整理", "擦", "割草"] }
      - { id: carry, description: "Say you take something out or bring it up/down (把……拿出去).", keywordHints: ["把", "拿", "出去", "上來", "下來"] }
      - { id: topic, description: "Say something about a group of things (這些……我都……).", keywordHints: ["這些", "都"] }
      - { id: outing, description: "Choose an outing (爬山, 烤肉, 棒球比賽).", keywordHints: ["爬山", "烤肉", "棒球", "比賽", "山"] }
      - { id: arrange, description: "Arrange the order of the weekend.", keywordHints: ["安排", "先", "然後"] }
    vocabExtras: [活動, 書房, 下來, 整理, 上來, 打掃, 割草, 畫, 拿, 擦, 院子, 烤肉, 把, 出去, 無聊, 山, 爬, 上去, 大概, 棒球, 比賽, 下山, 安排, 拿下來, 拿出去, 爬上去, 走下來, 紐約, 垃圾, 桌子, 椅子]
    opener: { zh: 你好！這個週末你有什麼活動？, en: "Hello! What activities do you have this weekend?" }
    successLine: { zh: 好，我們星期六先打掃院子，然後去爬山。, en: "Good. On Saturday we'll first clean the yard and then go hiking." }
journalPrompts:
  - { en: "Write a paragraph about the housework you do at the weekend and who carries things up, down, in or out (……上來 / 下去 / 出去).", zh: 我把垃圾拿出去。, words: [打掃, 整理, 擦, 院子], grammar: [gram-directional-lai-qu, gram-action-directional] }
  - { en: "Write a paragraph about what you do with the things in your home (把……拿出去 / 搬進來).", words: [拿, 書房, 安排, 出去], grammar: [gram-ba-directional, gram-action-directional] }
  - { en: "Write a paragraph about weekend activities, using a topic first (這些……我都……).", words: [活動, 爬, 烤肉, 棒球, 比賽], grammar: [gram-topic-sentence, gram-ba-directional] }
