  - { zh: 我把垃圾拿出去。, en: "I take the trash out.", grammar: [gram-ba-directional, gram-action-directional] }
  - { zh: 他把桌子搬進來。, en: "He carries the table in.", grammar: [gram-ba-directional, gram-action-directional] }
  - { zh: 請把書房的椅子拿過來。, en: "Please bring the chair from the study over.", grammar: [gram-ba-directional, gram-action-directional] }
  - { zh: 我把狗帶出去散步。, en: "I take the dog out for a walk.", grammar: [gram-ba-directional, gram-action-directional] }
